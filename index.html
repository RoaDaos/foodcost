<style>
/* VOICE: practical kitchen-office tool, direct, no fluff
   IDEA: the chef's order ticket on the pass: one big number shouting where money goes
   PICTURE: tomato-red band with the monthly leak in huge condensed figures, bars vs. industry benchmarks below
   COLOUR and TYPE: tomato red dominant, warm paper ground, ink for the cost slice; Barlow Condensed for figures, Barlow for text
   LAYOUT: brand bar, result band, sticky tabs, one calm column of inputs, cards for recipes */
:root{color-scheme:light dark;
--bg:light-dark(#f6f2ea,#151311);--paper:light-dark(#fffdf8,#201c19);--ink:light-dark(#1d1a17,#f1ece4);
--mute:light-dark(#6b635a,#a89f94);--line:light-dark(#e3dbcf,#3a342e);--red:light-dark(#c83a25,#e0553d);
--gold:light-dark(#b97d0c,#f0b43c);--ok:light-dark(#2f7d4f,#5cc489);--zone:light-dark(#2f7d4f33,#5cc48933)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,.fig-n{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,48px)}h2{font-size:32px;margin-bottom:16px}h3{font-size:22px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(5vw,16px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{width:40px;height:40px;flex:none}
.logo b{font:700 28px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.logo small{display:block;font-size:13px;color:var(--mute);line-height:1.2}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:transparent;color:var(--mute);border:0;border-radius:0;min-width:48px;padding:8px 10px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.top{padding-bottom:20px}.top p{margin:8px 0 0;color:var(--mute);max-width:60ch}
.note{font-size:13px;color:var(--mute)}
.hero{background:var(--red);color:#fff}
.hwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:end}
.big .lab{display:block;font-size:17px;opacity:.9}
.big b{display:block;font:700 clamp(64px,13vw,140px)/.95 "Barlow Condensed",sans-serif;margin:6px 0;white-space:nowrap}
.stats{display:grid;gap:14px;margin:0}
.stats div{border-top:1px solid #ffffff59;padding-top:10px;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 12px}
.stats dt{font-size:16px}.stats dd{margin:0;font:700 34px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.stats small{grid-column:1/-1;font-size:13px;opacity:.85}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:0 max(5vw,16px)}
nav.tabs a{flex:none;padding:14px 14px 12px;color:var(--mute);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;min-height:44px}
nav.tabs a[aria-current=page]{color:var(--ink);border-color:var(--red)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 7.5em;gap:6px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.bl b{display:block}.bl small,.bv small{display:block;color:var(--mute);font-size:13px}
.tr{position:relative;height:16px;background:var(--line);border-radius:3px;overflow:hidden}
.tr i{position:absolute;top:0;bottom:0;left:0}.zone{background:var(--zone);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.fill{height:6px!important;top:5px!important;border-radius:3px;background:var(--ok);transition:width .4s}
.warn .fill{background:var(--gold)}.bad .fill{background:var(--red)}
.bv{text-align:right;font:700 24px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap}.bv small{font:400 13px Barlow,sans-serif}
.bad .bv{color:var(--red)}.warn .bv{color:var(--gold)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);margin-top:36px}
.leak{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.leak h3{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.leak h3 span{color:var(--red);white-space:nowrap}
.leak ul{margin:10px 0 0;padding-left:20px}.leak li{margin:4px 0}
.theo{border-left:4px solid var(--gold);padding:4px 0 4px 18px}.theo p{margin:8px 0}
.theo .fig-n{font-size:44px;color:var(--red)}
fieldset{border:0;border-top:2px solid var(--ink);margin:0 0 26px;padding:12px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px 18px}
legend{font:700 22px "Barlow Condensed",sans-serif;padding-right:10px}
.hint{grid-column:1/-1;margin:0;font-size:13px;color:var(--mute)}
label{display:block;font-size:14px;font-weight:500}
.in{display:flex;align-items:center;margin-top:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.in em{font-style:normal;color:var(--mute);padding:0 12px}
input,textarea{font:16px Barlow,sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
.in input{border:0;background:transparent;text-align:right}
button{font:600 16px Barlow,sans-serif;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost,.add,.x{background:transparent;color:var(--ink);border-color:var(--line)}
.x{color:var(--red)}.add{margin-top:10px}
.form{max-width:900px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.rh{display:flex;gap:10px}.rh .rn{font:700 24px "Barlow Condensed",sans-serif}
.rf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.irow{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) 6em 44px;gap:8px;align-items:center;margin-bottom:8px}
.ihead{font-size:13px;color:var(--mute);margin-bottom:4px}.ml{display:none;font-size:12px;color:var(--mute)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.ro small{display:block;color:var(--mute);font-size:13px}.ro b{font:700 26px "Barlow Condensed",sans-serif;white-space:nowrap}
.ro .bad{color:var(--red)}.ro .warn{color:var(--gold)}.ro .ok{color:var(--ok)}
.target{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.target label{width:200px}
table{border-collapse:collapse;width:100%;margin-bottom:28px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--mute);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
textarea{min-height:140px;font-size:14px}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}html{scroll-padding-top:72px}
@media(max-width:860px){.hwrap,.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
.logo small{display:none}
.bar{grid-template-columns:minmax(0,1fr) auto}.bar .tr{grid-column:1/-1;grid-row:2}
.rf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rf label:first-child{grid-column:1/-1}
.irow{grid-template-columns:repeat(3,minmax(0,1fr)) 44px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.irow .iname{grid-column:1/4}.irow .idel{grid-column:4;grid-row:1}.irow .icost{grid-column:1/-1;text-align:left}
.ihead{display:none}.ml{display:block}.ro{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

r:EXN.map((d,k)=>({n:t().ex[k][0],p:d.p,t:d.t,v:d.v,i:d.i.map((x,j)=>({n:t().ex[k][1][j],q:x[0],pr:x[1],y:x[2]}))}))});

const F=[['s',['vm','vb']],['f',['fi','fa','ff'],'f'],['b',['bi','ba','bf']],['p',['sal','tax'],'p'],['e',['cur','gaz','apa']],['o',['chi','alt']],['w',['ris'],'w']];
const lab=k=>t().fld[k]||t().fld[{bi:'fi',ba:'fa',bf:'ff'}[k]];

function calc(){
const g=k=>num(S.m[k]);const vm=g('vm'),vb=g('vb'),V=vm+vb;
const cf=g('fi')+g('fa')-g('ff'),cb=g('bi')+g('ba')-g('bf');
const pers=g('sal')*(1+g('tax')/100),en=g('cur')+g('gaz')+g('apa'),chi=g('chi'),alt=g('alt'),ris=g('ris');
const total=cf+cb+pers+en+chi+alt,profit=V-total;
const cats=[{k:'food',v:cf,b:vm,lo:28,hi:35,of:'f'},{k:'bev',v:cb,b:vb,lo:18,hi:25,of:'b'},{k:'pers',v:pers,b:V,lo:25,hi:35,of:'v'},
{k:'prime',v:cf+cb+pers,b:V,lo:55,hi:65,of:'v',sum:1},{k:'en',v:en,b:V,lo:3,hi:6,of:'v'},{k:'chi',v:chi,b:V,lo:6,hi:10,of:'v'},
{k:'alt',v:alt,b:V,lo:4,hi:10,of:'v'},{k:'ris',v:ris,b:cf,lo:0,hi:4,of:'c',sum:1}];
cats.forEach(c=>{c.p=c.b>0?c.v/c.b*100:NaN;c.x=c.b>0?Math.max(0,(c.p-c.hi)/100*c.b):0;c.s=!(c.b>0)?'na':c.p<=c.hi?'ok':c.p<=c.hi*1.15?'warn':'bad'});
const leak=cats.filter(c=>!c.sum).reduce((a,c)=>a+c.x,0);
return{vm,V,profit,cats,leak,by:k=>cats.find(c=>c.k===k)}}

function rc(r){const cost=(r.i||[]).reduce((a,x)=>a+num(x.q)/1000*num(x.pr)/(Math.max(num(x.y),1)/100),0);
const net=num(r.p)/(1+num(r.t)/100);const tf=num(S.tf)/100||.3;
return{cost,net,fc:net>0?cost/net*100:NaN,mg:net-cost,rec:cost/tf*(1+num(r.t)/100),sold:num(r.v)}}
const st=fc=>{const g=num(S.tf)||30;return !isFinite(fc)?'':fc<=g?'ok':fc<=g*1.15?'warn':'bad'};

function renderTop(){const c=calc(),T=t();
$('#hero').innerHTML=`<div class="wrap hwrap"><div class="big"><span class="lab">${T.leakLab}</span><b>${fe.format(c.leak)}</b><span class="lab">${T.perMonth} · ${c.leak>0?T.perYear(fe.format(c.leak*12)):T.inRange}</span></div>
<dl class="stats"><div><dt>${T.profit}</dt><dd>${fe.format(c.profit)}</dd><small>${fp(c.V?c.profit/c.V*100:NaN)} ${T.ofSales}</small></div>
<div><dt>${T.prime}</dt><dd>${fp(c.by('prime').p)}</dd><small>${T.ref} 55–65 %</small></div>
<div><dt>${T.foodReal}</dt><dd>${fp(c.by('food').p)}</dd><small>${T.ref} 28–35 %</small></div></dl></div>`;
$('#bars').innerHTML=c.cats.map(x=>{const sc=x.hi*1.6,w=isFinite(x.p)?Math.min(x.p/sc,1)*100:0;
return`<div class="bar ${x.s}"><div class="bl"><b>${T.cn[x.k]}</b><small>${fe.format(x.v)} · ${T.of[x.of]}</small></div><div class="tr"><i class="zone" style="left:${x.lo/sc*100}%;width:${(x.hi-x.lo)/sc*100}%"></i><i class="fill" style="width:${w}%"></i></div><div class="bv">${fp(x.p)}<small>${T.ref} ${x.lo?x.lo+'–'+x.hi:T.under+' '+x.hi} %</small></div></div>`}).join('');
const Lk=c.cats.filter(x=>!x.sum&&x.x>0).sort((a,b)=>b.x-a.x),r=c.by('ris');
let h=Lk.map(x=>`<div class="leak"><h3>${T.cn[x.k]}<span>+${fe.format(x.x)}${T.perMo}</span></h3><ul>${T.T[x.k].map(s=>`<li>${s}</li>`).join('')}</ul></div>`).join('');
if(r.s==='warn'||r.s==='bad')h+=`<div class="leak"><h3>${T.cn.ris}<span>${fp(r.p)}</span></h3><ul>${T.T.ris.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
$('#leaks').innerHTML=h||`<div class="leak"><h3>${T.allOk}</h3><p>${T.allOkP}</p></div>`;
const rs=S.r.map(rc).filter(x=>x.sold>0),tc=rs.reduce((a,x)=>a+x.cost*x.sold,0),tn=rs.reduce((a,x)=>a+x.net*x.sold,0);
const th=tn>0?tc/tn*100:NaN,real=c.by('food').p;
if(isFinite(th)&&isFinite(real)){const gap=real-th;
$('#theo').innerHTML=`<p>${T.thTh}: <b>${fp(th)}</b><br>${T.thReal}: <b>${fp(real)}</b></p>${gap>1?`<div class="fig-n">≈ ${fe.format(gap/100*c.vm)}${T.perMo}</div><p>${T.thGap(fp(gap))}</p>`:`<p>${T.thOk}</p>`}<p class="note">${T.thNote}</p>`}
else $('#theo').innerHTML=`<p>${T.thEmpty}</p>`}

function renderForm(){const T=t();$('#mform').innerHTML=F.map(([g,fs,hk])=>`<fieldset><legend>${T.grp[g]}</legend>${fs.map(k=>`<label for="m_${k}">${lab(k)}<span class="in"><input id="m_${k}" inputmode="decimal" data-m="${k}" value="${esc(S.m[k])}"><em>${k==='tax'?'%':'€'}</em></span></label>`).join('')}${hk?`<p class="hint">${T.hint[hk]}</p>`:''}</fieldset>`).join('')}

$('#rlist').innerHTML=S.r.map((r,ri)=>`<article class="card" data-r="${ri}">

<label><span class="ml">${T.yld}</span><input inputmode="decimal" data-k="y" value="${esc(x.y)}" aria-label="${T.yld}"></label>
<span class="num icost" id="ic${ri}_${ii}"></span><button class="x idel" data-del-i="${ri}_${ii}" aria-label="${T.delI}">×</button></div>`).join('')}
<button class="add" data-add-i="${ri}">${T.addI}</button>
<div class="ro" id="ro${ri}"></div></article>`).join('')||`<p>${T.none}</p>`;
updRecipes()}

function updRecipes(){const T=t(),all=S.r.map(rc);
S.r.forEach((r,ri)=>{(r.i||[]).forEach((x,ii)=>{const e=$(`#ic${ri}_${ii}`);if(e)e.textContent=fe2.format(num(x.q)/1000*num(x.pr)/(Math.max(num(x.y),1)/100))});
const k=all[ri],e=$('#ro'+ri);if(e)e.innerHTML=`<div><small>${T.cpp}</small><b>${fe2.format(k.cost)}</b></div><div><small>${T.fc}</small><b class="${st(k.fc)}">${fp(k.fc)}</b></div><div><small>${T.mpp}</small><b>${fe2.format(k.mg)}</b></div><div><small>${T.pfor(fp(num(S.tf)||30))}</small><b>${fe2.format(k.rec)}</b></div>`});
const sold=all.filter(x=>x.sold>0),n=sold.length,ts=sold.reduce((a,x)=>a+x.sold,0),am=ts?sold.reduce((a,x)=>a+x.mg*x.sold,0)/ts:0;
const cat=x=>{if(!n||!x.sold)return'–';const pop=x.sold>=.7*ts/n,pro=x.mg>=am;return T.vd[pop&&pro?0:pop?1:pro?2:3]};
const rows=S.r.map((r,i)=>({r,k:all[i]})).sort((a,b)=>b.k.mg*b.k.sold-a.k.mg*a.k.sold),H=T.mh;
$('#menu').innerHTML=rows.length?`<table class="stack"><thead><tr><th>${H[0]}</th><th class="n">${H[1]}</th><th class="n">${H[2]}</th><th class="n">${H[3]}</th><th class="n">${H[4]}</th><th>${H[5]}</th></tr></thead><tbody>${rows.map(({r,k})=>`<tr><td>${esc(r.n)}</td><td class="n">${fp(k.fc)}</td><td class="n">${fe2.format(k.mg)}</td><td class="n">${k.sold}</td><td class="n">${fe.format(k.mg*k.sold)}</td><td>${cat(k)}</td></tr>`).join('')}</tbody></table>`:''}

$('#addR').addEventListener('click',()=>{S.r.push({n:t().newDish,p:'',t:'10',v:'',i:[{n:'',q:'',pr:'',y:'100'}]});save();renderRecipes();renderTop()});
$('#copy').addEventListener('click',async()=>{const s=JSON.stringify(S);try{await navigator.clipboard.writeText(s);$('#copied').textContent=t().copied}catch(e){$('#imp').value=s;$('#copied').textContent=t().copyFail}});
$('#doImp').addEventListener('click',()=>{try{const d=JSON.parse($('#imp').value);if(!d.m||!Array.isArray(d.r))throw 0;S=d;save();renderAll();$('#msg').textContent=t().imported}catch(e){$('#msg').textContent=t().badImp}});
$('#ex').addEventListener('click',()=>{S=EX();save();renderAll();$('#msg').textContent=t().exDone});
let arm=0;$('#clr').addEventListener('click',e=>{if(!arm){arm=1;e.target.textContent=t().clr2;return}
arm=0;e.target.textContent=t().clr;S={tf:'30',m:{tax:'30'},r:[]};save();renderAll();$('#msg').textContent=t().cleared});

const views=['analiza','costuri','retete','date'];
function show(){const h=location.hash.slice(1),v=views.includes(h)?h:'analiza';views.forEach(x=>{$('#'+x).hidden=x!==v;$(`nav a[href="#${x}"]`).setAttribute('aria-current',x===v?'page':'false')})}
addEventListener('hashchange',show);
renderAll();show();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
